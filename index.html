*{box-sizing:border-box;margin:0;padding:0;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f4f6f8;color:#1a1a1a;line-height:1.45}
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#login .ic{width:58px;height:58px;border-radius:50%;background:#e6f1fb;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
#login .ic svg{width:28px;height:28px;stroke:#185fa5;fill:none;stroke-width:2}

#login input{width:100%;max-width:280px;font-size:16px;padding:12px 14px;border:1.5px solid #cdd5dd;border-radius:11px;outline:none;margin-bottom:10px}
#login input:focus{border-color:#185fa5}
#login button{width:100%;max-width:280px;font-size:15px;font-weight:700;padding:13px;border:none;border-radius:11px;background:#185fa5;color:#fff;cursor:pointer}
#login button:active{transform:scale(.98)}
#lerr{color:#a32d2d;font-size:12px;margin-top:12px;min-height:16px;font-weight:600}
#content{display:none}
.foot{text-align:center;font-size:10px;color:#bbb;margin:18px auto 30px;padding-top:14px;border-top:1px solid #e5e3da;max-width:96%}
#login input[type="password"]#pwd2,#login input[type="password"]#pwd3{border-color:#185fa5}
#pwdStrength{height:4px;border-radius:2px;margin:-6px 0 10px;transition:all .3s;max-width:280px}

          cambioBox.style.display='block';
          document.getElementById('loginDesc').textContent='Bienvenido/a '+usr.nombre.split(' ')[0]+'. Elige tu contraseña personal.';
          loginBtn.textContent='Establecer contraseña';
          loginBtn.disabled=false; return;
        }
        try{await supa.auth.signInWithPassword({email:u+'@mitechlocal.com',password:pRaw});}catch(_){}
        saveSession(usr.rol,usr.nombre,u);
        await openReport(usr.rol,usr.nombre,u);
        return;
      }
    }
  }catch(e){ console.warn('Supabase login error:',e); }

  // Fallback: login local con CREDS (por si no hay conexión)
  var h2=await sha256hex(u+'|'+p);
  var info=CREDS[h2];
  if(!info){err.textContent='Usuario o contraseña incorrectos.';loginBtn.textContent='Entrar';loginBtn.disabled=false;return;}
  try{
    try{await supa.auth.signInWithPassword({email:u+'@mitechlocal.com',password:pRaw});}catch(_){}
    saveSession(info.role,info.name,u);
    await openReport(info.role,info.name,u);
  }catch(e){err.textContent='Error al abrir el reporte.';loginBtn.textContent='Entrar';loginBtn.disabled=false;}
}

async function cambiarPasswordPrimerAcceso(usr,newPwd){
  var err=document.getElementById('lerr'); err.textContent='';
  var loginBtn=document.getElementById('loginBtn');
  loginBtn.textContent='Guardando...'; loginBtn.disabled=true;
  try{
    var newH=await sha256hex(usr.username+'|'+newPwd.toUpperCase());
    var r=await supa.from('usuarios').update({pwd_hash:newH,debe_cambiar:false}).eq('username',usr.username);
    if(r.error){err.textContent='Error al guardar la contraseña. Intenta de nuevo.';loginBtn.textContent='Establecer contraseña';loginBtn.disabled=false;return;}
    usr.debe_cambiar=false; usr.pwd_hash=newH;
    document.getElementById('cambioBox').style.display='none';
    saveSession(usr.rol,usr.nombre,usr.username);
    await openReport(usr.rol,usr.nombre,usr.username);
  }catch(e){err.textContent='Error de conexión. Intenta de nuevo.';loginBtn.textContent='Establecer contraseña';loginBtn.disabled=false;}
}
// Restaurar sesión tras refresh (si no expiró), o SSO desde el Portal (sesión Supabase Auth compartida)
window.addEventListener('DOMContentLoaded',async function(){
  try{
    var s=JSON.parse(sessionStorage.getItem('mitech_sess')||'null');
    if(s && s.exp && Date.now()<s.exp){
      saveSession(s.role,s.name,s.username||'');
      await openReport(s.role,s.name,s.username||'');
      return;
    } else if(s){ clearSession(); }
  }catch(e){}
  // SSO: si el Portal ya autenticó (Supabase Auth, mismo origen jcgt1976.github.io), entrar directo
  try{
    if(supa){
      var sess=await supa.auth.getSession();
      var authUser=sess && sess.data && sess.data.session && sess.data.session.user;
      if(authUser){
        var r=await supa.from('usuarios').select('*').eq('auth_id',authUser.id).single();
        if(r.data && r.data.activo!==false && !r.data.debe_cambiar){
          saveSession(r.data.rol,r.data.nombre,r.data.username||'');
          await openReport(r.data.rol,r.data.nombre,r.data.username||'');
        }
      }
    }
  }catch(e){console.warn('SSO check:',e);}
});
